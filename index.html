<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOUNGE MOTION — Showcase</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ============================================================
    NAVBAR
    ============================================================ -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">LOUNGE <span>MOTION</span></a>
            <ul class="nav-links" id="navLinks">
                <!-- Diisi oleh JavaScript -->
            </ul>
        </div>
    </nav>

    <!-- ============================================================
    HERO — RATA KIRI
    ============================================================ -->
    <section class="hero">
        <div class="container">
            <h1>Motion <span class="text-gold">Showcase</span></h1>
            <p>Koleksi motion graphics premium untuk kebutuhan kreatifmu.</p>
        </div>
    </section>

    <!-- ============================================================
    MAIN CONTENT
    ============================================================ -->
    <main class="container">

        <!-- Filter Bar -->
        <div class="filter-bar" id="filterBar">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari motion..." />
            </div>

            <div class="filter-group">
                <select id="tierFilter">
                    <option value="all">Semua Tier</option>
                    <option value="free">FREE</option>
                    <option value="basic">BASIC</option>
                    <option value="plus">PLUS</option>
                    <option value="premium">PREMIUM</option>
                </select>

                <select id="sortFilter">
                    <option value="default">Urutkan</option>
                    <option value="price-asc">Harga ↑</option>
                    <option value="price-desc">Harga ↓</option>
                    <option value="name">Nama A–Z</option>
                </select>

                <button class="clear-btn" id="clearFilters">
                    <i class="fas fa-times"></i> Reset
                </button>
            </div>
        </div>

        <!-- Category Pills -->
        <div class="pills-wrap" id="pillsWrap"></div>

        <!-- Grid Motion -->
        <div class="grid-motion" id="gridMotion"></div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>

    </main>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <footer class="footer">
        <div class="container">
            <div class="footer-links" id="footerLinks">
                <!-- Diisi oleh JavaScript -->
            </div>
            <div class="socials">
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
                <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
            <p>&copy; 2026 LOUNGE MOTION. All rights reserved.</p>
        </div>
    </footer>

    <!-- ============================================================
    MODAL ORDER
    ============================================================ -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Pesan Motion</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dinamis diisi JS -->
            </div>
        </div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script src="js/main.js"></script>

</body>
</html>
